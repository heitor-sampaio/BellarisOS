# Configuração do serviço "Notification Cron".
#
# Precisa ser um arquivo separado: o railway.toml da raiz fixa
# dockerfilePath = "Dockerfile" e sobrescreve o que for configurado no painel
# ou pela API — foi por isso que o serviço de cron ficou buildando a imagem do
# app inteiro (WORKDIR /repo) e subindo sem o script, com
# "Cannot find module /app/cron.mjs".
#
# Aponte o serviço para este arquivo em Settings → Config file.

[build]
builder        = "dockerfile"
dockerfilePath = "Dockerfile.cron"

[deploy]
# Job de execução única por disparo: não reiniciar quando o processo termina.
restartPolicyType = "never"
cronSchedule      = "0 * * * *"
