# A regressão completa — SÓ À MÃO (Actions → E2E → Run workflow, ou gh workflow run e2e.yml).
#
# Rodava a cada push na main, e a espera pelo resultado travava o ritmo do
# desenvolvimento (Heitor, 2026-09-28): a suíte leva ~17 min. Agora roda quando
# o Heitor pede; no dia a dia, só os testes novos.
#
# Segurança (decisão do Heitor, 2026-09-28 — repositório privado):
# - só à mão; NUNCA em pull_request, que é o caminho de um
#   workflow alterado ler os secrets;
# - os secrets moram no environment `e2e`, restrito à main
#   (Settings → Environments → e2e → Deployment branches: main);
# - só as três chaves do Supabase (o admin de teste é o padrão do global-setup). O resto é gerado a
#   cada execução e morre com ela: CRON_SECRET e META_APP_SECRET são do app que
#   sobe aqui mesmo, e as chaves VAPID só assinam push para endpoints falsos.
name: E2E

on:
  workflow_dispatch:

concurrency:
  # Duas rodadas no mesmo banco disputariam os mesmos registros: a nova espera.
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    # Fixo, não `ubuntu-latest`: o `playwright install --with-deps` instala as
    # bibliotecas do sistema pela lista da distro, e o `latest` vira Ubuntu 26
    # em 2026-10-19 sem ninguém pedir. Trocar de versão é decisão, junto com
    # conferir que o Playwright do projeto suporta a nova.
    runs-on: ubuntu-24.04
    environment: e2e
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      TZ: America/Sao_Paulo
      NEXT_TELEMETRY_DISABLED: '1'
      # O cadastro incorporado da Meta fala com a Graph FALSA do E2E (porta fixa,
      # e2e/whatsapp-cadastro-incorporado.spec.ts), e precisa de um id de app —
      # qualquer um: a Graph falsa não confere. O segredo é o gerado abaixo.
      META_GRAPH_BASE_TESTE: http://127.0.0.1:3199
      META_APP_ID: e2e-app
      # A cobrança fala com o Asaas FALSO do E2E (porta fixa,
      # e2e/assinaturas-asaas.spec.ts); chave e token são de mentira.
      ASAAS_BASE_URL_TESTE: http://127.0.0.1:3198
      ASAAS_API_KEY: $aact_hmlg_e2e-falsa
      ASAAS_WEBHOOK_TOKEN: e2e-token-do-webhook-do-asaas-0123456789abcdef
      # A conexão gerenciada do WhatsApp cria instâncias na uazapi FALSA (porta
      # fixa, e2e/apoio/uazapi-falsa.ts) — a real cobra cada uma.
      UAZAPI_BASE_URL: http://127.0.0.1:3197
      UAZAPI_ADMIN_TOKEN: e2e-admintoken-da-uazapi-falsa
      # O Copilot fala com a OpenAI FALSA (porta fixa, e2e/apoio/openai-falsa.ts).
      OPENAI_BASE_URL_TESTE: http://127.0.0.1:3196/v1
      OPENAI_API_KEY: e2e-chave-da-openai-falsa
      # O custo REAL do Copilot no sistema (Costs API na falsa) e o filtro pelo
      # projeto — os mesmos da playwright.build.config. Aqui o servidor sobe
      # pelo workflow, e o que só a config tinha não chegava a ele.
      OPENAI_ADMIN_KEY: e2e-chave-admin-da-openai-falsa
      OPENAI_PROJECT_ID: proj_e2e_bellaris
      PLATAFORMA_ADMIN_EMAIL: e2e-plataforma-primeiro-admin@bellaris.invalid
      # Cookie de sessão sem Secure: o servidor do build roda em http (ver playwright.build.config.ts).
      COOKIE_DE_SESSAO_SEM_SECURE: "1"
      # Os TRÊS apps (2026-10-06), cada um no seu host — cookie não separa
      # porta, só host. Os servidores sobem aqui (não pelo Playwright), então
      # os endereços vão no ambiente do job.
      CLINICA_URL: http://127.0.0.1:3100
      SISTEMA_URL: http://127.0.0.2:3101
      SUPORTE_URL: http://127.0.0.3:3102
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Segredos descartáveis desta execução
        run: |
          CRON=$(openssl rand -hex 32);  echo "::add-mask::$CRON"
          META=$(openssl rand -hex 32);  echo "::add-mask::$META"
          VERIFY=$(openssl rand -hex 16); echo "::add-mask::$VERIFY"
          INTERNO=$(openssl rand -hex 32); echo "::add-mask::$INTERNO"
          VAPID=$(pnpm exec web-push generate-vapid-keys --json)
          PUB=$(echo "$VAPID" | node -pe 'JSON.parse(require("fs").readFileSync(0)).publicKey')
          PRIV=$(echo "$VAPID" | node -pe 'JSON.parse(require("fs").readFileSync(0)).privateKey')
          echo "::add-mask::$PRIV"
          {
            echo "CRON_SECRET=$CRON"
            echo "META_APP_SECRET=$META"
            echo "META_VERIFY_TOKEN=$VERIFY"
            echo "INTERNO_SECRET=$INTERNO"
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$PUB"
            echo "VAPID_PRIVATE_KEY=$PRIV"
            echo "VAPID_SUBJECT=mailto:e2e@bellaris.invalid"
          } >> "$GITHUB_ENV"

      # Normalmente leva ~20 s. Em 2026-10-07 travou duas vezes seguidas (30 min
      # e 7 min parado, sem erro — a instalação das dependências do sistema
      # pendurada). Cada tentativa tem 4 min; três tentativas, e a etapa inteira
      # falha em 14 min em vez de prender a rodada.
      - name: Navegador do Playwright
        timeout-minutes: 14
        run: |
          for tentativa in 1 2 3; do
            if timeout 240 pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::instalação do navegador falhou ou travou (tentativa $tentativa)"
            sleep 15
          done
          exit 1

      - name: Build dos três apps
        run: |
          pnpm exec next build
          ( cd ../sistema && pnpm exec next build )
          ( cd ../suporte && pnpm exec next build )

      # Um servidor de cada app para as duas metades (playwright.build.config.ts:
      # E2E_SERVIDOR_PRONTO faz as duas os reaproveitarem).
      - name: Servidores do build
        run: |
          nohup node scripts/servir-build.mjs 3100 web 127.0.0.1 > servidor.log 2>&1 &
          nohup node scripts/servir-build.mjs 3101 sistema 127.0.0.2 > servidor-sistema.log 2>&1 &
          nohup node scripts/servir-build.mjs 3102 suporte 127.0.0.3 > servidor-suporte.log 2>&1 &
          espera() {
            for i in $(seq 1 60); do curl -sf -o /dev/null "$1" && return 0; sleep 2; done
            return 1
          }
          espera http://127.0.0.1:3100/privacidade \
            && espera http://127.0.0.2:3101/api/health \
            && espera http://127.0.0.3:3102/api/health \
            && exit 0
          tail -n 50 servidor.log servidor-sistema.log servidor-suporte.log; exit 1

      # As duas metades (apps/web/e2e/grupos.ts) JUNTAS, desde 2026-09-30: a
      # varredura de sobras só leva o [e2e] com mais de uma hora
      # (e2e/apoio/limpeza.ts), então uma não apaga o que a outra está usando.
      # Os isolados (rede [e2e] própria) em 3 workers; os compartilhados (rede
      # real, sessão padrão, cron) um por vez. Cada linha sai com o nome da
      # metade na frente, e o passo falha se qualquer uma falhar.
      - name: Suíte — isolados e compartilhados, juntas
        env:
          E2E_SERVIDOR_PRONTO: '1'
          E2E_WORKERS: '3'
        run: |
          set -o pipefail
          ( E2E_GRUPO=isolados pnpm exec playwright test -c playwright.build.config.ts --reporter=list 2>&1 | sed -u 's/^/[isolados] /' ) &
          ISO=$!
          ( E2E_GRUPO=compartilhados pnpm exec playwright test -c playwright.build.config.ts --reporter=list 2>&1 | sed -u 's/^/[compartilhados] /' ) &
          COM=$!
          # `x && R=0 || R=$?`: o shell do Actions roda com -e, e um `wait` que
          # falha sozinho encerraria o passo sem esperar a outra metade.
          wait $ISO && R1=0 || R1=$?
          wait $COM && R2=0 || R2=$?
          echo "isolados: saída $R1 · compartilhados: saída $R2"
          [ $R1 -eq 0 ] && [ $R2 -eq 0 ]

      - name: Log dos servidores
        if: failure()
        run: tail -n 300 servidor.log servidor-sistema.log servidor-suporte.log

      - name: Relatório das falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-falhas
          path: apps/web/test-results/
          retention-days: 7
